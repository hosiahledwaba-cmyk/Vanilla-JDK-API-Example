server.port=8080
db.url=jdbc:mysql://localhost:3306/robinhood
db.user=root
db.pass=yourpass
max.threads=200
admin.token=super-secret-admin-token
admin.viewer.token=viewer-secret
admin.operator.token=operator-secret
admin.super.token=super-secret
tls.enabled=false
tls.keystore.path=certs/robinhood.jks
tls.keystore.password=changeit
# ---------- KYC Provider ----------
kyc.api.url=https://api.kycprovider.com/v1
kyc.api.key=YOUR_KYC_API_KEY

# ---------- Stripe ----------
stripe.apiKey=sk_test_XXXXXXXXXXXXXXXX

# ---------- Ozow ----------
ozow.apiUrl=https://api.ozow.com
ozow.merchantCode=YOUR_OZOW_MERCHANT_CODE
ozow.securityKey=YOUR_OZOW_SECURITY_KEY

# ---------- PayFast ----------
payfast.apiUrl=https://www.payfast.co.za/eng/process
payfast.id=YOUR_PAYFAST_ID
payfast.key=YOUR_PAYFAST_KEY
payfast.notifyUrl=https://your.domain/payment/payfast/notify
payfast.returnUrl=https://your.domain/dashboard

# ---------- Apple Pay (via Braintree) ----------
braintree.merchantId=YOUR_BT_MERCHANT_ID
braintree.publicKey=YOUR_BT_PUBLIC_KEY
braintree.privateKey=YOUR_BT_PRIVATE_KEY
braintree.environment=sandbox

# ---------- BluVoucher ----------
bluvoucher.apiUrl=https://api.bluvoucher.com/v1
bluvoucher.apiKey=YOUR_BLUVOUCHER_KEY

