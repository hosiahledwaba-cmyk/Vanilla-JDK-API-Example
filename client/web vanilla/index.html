<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RobinHood — Vanilla JDK Gaming Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <header class="app-header">
    <div class="header-container">
      <a href="#" class="brand" id="brandLogo">
        <div class="brand-icon">🏹</div>
        <span>RobinHood</span>
      </a>

      <div class="nav-controls">
        <div id="balanceChip" class="balance-chip hidden">
          <span>🪙</span>
          <span id="headerBalance">0</span>
        </div>

        <div id="userBadge" class="user-badge hidden">
          <div class="user-avatar" id="headerAvatar">?</div>
          <span id="headerUsername">Player</span>
        </div>

        <button id="logoutBtn" class="btn btn-secondary hidden" style="padding: 0.4rem 0.85rem; font-size: 0.85rem;">
          Log Out
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="main-wrapper">
    <div id="app"></div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main Application Script -->
  <script type="module" src="scripts/main.js"></script>

</body>
</html>
