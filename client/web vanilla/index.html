<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RobinHood — Contemporary Gaming Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Discover games, play against tactical AI, or compete in real-time multiplayer with custom rooms and instant matchmaking." />
  <meta name="theme-color" content="#101216" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Top Sticky Header Navigation Bar -->
  <header class="app-header">
    <div class="header-container">
      <a href="#" class="brand" id="brandLogo" aria-label="RobinHood Gaming Home">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">RobinHood</span>
          <span class="brand-sub">Platform</span>
        </div>
      </a>

      <div class="nav-controls">
        <div id="balanceChip" class="balance-chip hidden" title="Available Balance">
          <span class="balance-icon">
            <svg class="app-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7v10M9 9.5h6M9 14.5h6"/>
            </svg>
          </span>
          <span id="headerBalance" class="balance-value">0</span>
          <span class="balance-currency">Tokens</span>
        </div>

        <div id="userBadge" class="user-badge hidden" title="Logged in player">
          <div class="user-avatar" id="headerAvatar">P</div>
          <span id="headerUsername" class="user-name">Player</span>
        </div>

        <a href="/docs" target="_blank" class="nav-action-link" title="Open Swagger API Explorer & Live System Telemetry">
          <span class="action-icon">
            <svg class="app-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
          </span>
          <span class="action-label">API & Monitor</span>
        </a>

        <button id="logoutBtn" class="btn btn-ghost btn-sm hidden" title="Log out of current session">
          Log Out
        </button>
      </div>
    </div>
  </header>

  <!-- Main Viewport Shell -->
  <main class="main-wrapper">
    <div id="app" class="app-viewport"></div>
  </main>

  <!-- Toast Notification Stack -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Main Application Orchestrator -->
  <script type="module" src="scripts/main.js"></script>

</body>
</html>
